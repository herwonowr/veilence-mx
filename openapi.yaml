openapi: 3.1.0
info:
  title: Veilence-MX API
  description: >
    Enterprise SaaS supply chain compromise monitor for PyPI and npm packages.
    Provides endpoints for package monitoring, release analysis, alert management,
    organization/RBAC, notifications, and system administration.
  version: 1.0.0
  contact:
    name: Veilence-MX Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.veilence.example.com
    description: Production server

tags:
  - name: Health
    description: Health check and readiness endpoints
  - name: Auth
    description: Authentication, registration, password management, and API keys
  - name: Dashboard
    description: Dashboard statistics, recent releases, and chart data
  - name: Packages
    description: Package monitoring CRUD
  - name: Releases
    description: Release details with diffs and analyses
  - name: Alerts
    description: Security alert listing and status management
  - name: Organizations
    description: Organization CRUD, member management, invitations, and roles
  - name: Settings
    description: System settings and sync triggers
  - name: Notifications
    description: Notification channels, rules, and user notifications
  - name: Queue
    description: Job queue monitoring and dead letter management
  - name: Sessions
    description: Session management

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ─── Health ──────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Checks database and Redis connectivity. Returns 503 if degraded.
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: All systems operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: >
        Returns 200 only when all dependencies (database and Redis) are reachable.
        Designed for Kubernetes readiness probes and load balancer health checks.
      security: []
      operationId: readinessCheck
      responses:
        "200":
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready — one or more dependencies unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Returns Prometheus-format metrics for monitoring.
      security: []
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus metrics output
          content:
            text/plain:
              schema:
                type: string

  # ─── Auth (Public) ───────────────────────────────────────────────
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account and returns tokens for immediate login.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: User login
      description: Authenticates a user and returns access and refresh tokens.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      description: Exchanges a valid refresh token for a new token pair.
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Initiate password reset
      description: >
        Sends a password reset email. Always returns 200 to prevent user enumeration.
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      description: Resets a user's password using a valid reset token.
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      description: Verifies a user's email using a valid verification token.
      security: []
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ─── Auth (Protected) ───────────────────────────────────────────
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Invalidates the provided refresh token.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the authenticated user's profile.
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Auth]
      summary: Update profile
      description: Updates the authenticated user's first name and last name.
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      description: Changes the authenticated user's password.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/send-verification:
    post:
      tags: [Auth]
      summary: Send verification email
      description: Sends a new email verification token to the authenticated user.
      operationId: sendVerificationEmail
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/api-keys:
    post:
      tags: [Auth]
      summary: Create API key
      description: Creates a new API key for the authenticated user.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created (includes the raw key — shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      tags: [Auth]
      summary: List API keys
      description: Returns all API keys for the authenticated user.
      operationId: listApiKeys
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/api-keys/{id}:
    delete:
      tags: [Auth]
      summary: Revoke API key
      description: Revokes (deletes) an API key belonging to the authenticated user.
      operationId: revokeApiKey
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Sessions ────────────────────────────────────────────────────
  /api/auth/sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      description: Returns all active sessions for the authenticated user.
      operationId: listSessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke session
      description: Deletes a specific session belonging to the authenticated user.
      operationId: revokeSession
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Notifications (user-scoped) ────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List user notifications
      description: Lists the current user's notifications across all organizations.
      operationId: listUserNotifications
      parameters:
        - name: unread
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter to only unread notifications when "true"
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      description: Returns the count of unread notifications for the current user.
      operationId: getUnreadCount
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        format: int64
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications read
      description: Marks all unread notifications as read for the current user.
      operationId: markAllNotificationsRead
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                        format: int64
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark notification read
      description: Marks a single notification as read.
      operationId: markNotificationRead
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Notification marked as read
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Permissions ─────────────────────────────────────────────────
  /api/permissions:
    get:
      tags: [Organizations]
      summary: List all permissions
      description: Lists all available system permissions (not org-scoped).
      operationId: listPermissions
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PermissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Invitations (public) ────────────────────────────────────────
  /api/invitations/{token}:
    get:
      tags: [Organizations]
      summary: Get invitation info (public)
      description: >
        Returns invitation details so the frontend can display "You've been invited
        to {org}" before the user logs in. No authentication required.
      security: []
      operationId: getInvitationInfo
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      email:
                        type: string
                      orgId:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
                      accepted:
                        type: boolean
                      expired:
                        type: boolean
                  error:
                    type: string
                    nullable: true
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Dashboard (org-scoped) ─────────────────────────────────────
  /api/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      description: Returns overview statistics (total packages, releases, pending analyses, active alerts, recent malicious) scoped to the current organization.
      operationId: getDashboardStats
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_DashboardStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/dashboard/recent-releases:
    get:
      tags: [Dashboard]
      summary: Get recent releases
      description: Returns the most recent releases with package info and classification, paginated.
      operationId: getRecentReleases
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: registry
          in: query
          schema:
            type: string
            enum: [pypi, npm]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, diffing, analyzing, completed, error]
        - name: search
          in: query
          schema:
            type: string
          description: Search by package name (ILIKE)
        - name: latest_per_package
          in: query
          schema:
            type: string
            enum: ["true"]
          description: When "true", return only the latest release per package
        - name: classification
          in: query
          schema:
            type: string
            enum: [benign, suspicious, malicious, baseline]
      responses:
        "200":
          description: Recent releases with pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_RecentReleaseList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/dashboard/charts:
    get:
      tags: [Dashboard]
      summary: Get chart data
      description: Returns aggregated data for dashboard charts (release activity, classifications, registries, alerts, statuses).
      operationId: getChartData
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD). Defaults to today.
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ChartData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Packages (org-scoped) ──────────────────────────────────────
  /api/packages:
    get:
      tags: [Packages]
      summary: List packages
      description: Returns a paginated list of monitored packages scoped to the current organization.
      operationId: listPackages
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: registry
          in: query
          schema:
            type: string
            enum: [pypi, npm]
        - name: is_custom
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: search
          in: query
          schema:
            type: string
          description: Search by package name (ILIKE)
      responses:
        "200":
          description: Paginated package list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_PackageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Packages]
      summary: Add package to monitoring
      description: Adds a custom package to monitoring. Requires `packages:write` permission.
      operationId: createPackage
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePackageRequest"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Package"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/packages/{id}:
    get:
      tags: [Packages]
      summary: Get package
      description: Returns a single package by ID.
      operationId: getPackage
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Package details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Package"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Packages]
      summary: Delete package
      description: Removes a package from monitoring. Requires `packages:delete` permission.
      operationId: deletePackage
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Package deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/packages/{id}/releases:
    get:
      tags: [Releases]
      summary: List package releases
      description: Returns a paginated list of releases for a specific package.
      operationId: listPackageReleases
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated release list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ReleaseList"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Releases (org-scoped) ──────────────────────────────────────
  /api/releases/{id}:
    get:
      tags: [Releases]
      summary: Get release detail
      description: Returns a single release with its diff, analysis, and package info.
      operationId: getRelease
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Release with diff and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ReleaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Alerts (org-scoped) ────────────────────────────────────────
  /api/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Returns a paginated list of alerts scoped to the current organization.
      operationId: listAlerts
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          schema:
            type: string
            enum: [new, acknowledged, resolved]
      responses:
        "200":
          description: Paginated alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/alerts/{id}:
    patch:
      tags: [Alerts]
      summary: Update alert status
      description: Updates the status of an alert. Requires `alerts:write` permission.
      operationId: updateAlert
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRequest"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Alert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Settings (org-scoped) ──────────────────────────────────────
  /api/settings:
    get:
      tags: [Settings]
      summary: Get settings
      description: Returns all settings as a key-value map for the current organization.
      operationId: getSettings
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Settings]
      summary: Update settings
      description: >
        Updates settings from a key-value map. Requires `settings:write` permission.
        Valid keys: pypi_poll_interval, npm_poll_interval, pypi_top_n, npm_top_n,
        analyzer_mode, top_n_refresh_interval, diff_size_limit, version_depth_mode,
        version_depth_count.
      operationId: updateSettings
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              example:
                pypi_poll_interval: "10m"
                npm_top_n: "200"
      responses:
        "200":
          description: Updated settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
                  error:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sync/top-packages:
    post:
      tags: [Settings]
      summary: Sync top packages
      description: >
        Triggers an immediate top-N package sync. Requires `settings:write` permission.
        Rate limited (sync category).
      operationId: syncTopPackages
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - name: registry
          in: query
          schema:
            type: string
            enum: [pypi, npm]
          description: Sync a specific registry only. Omit to sync both.
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Rate limit exceeded

  /api/sync/reanalyze:
    post:
      tags: [Settings]
      summary: Re-analyze all unanalyzed diffs
      description: >
        Re-queues all un-analyzed diffs for analysis, scoped to the current
        organization's packages. Requires `settings:write` permission.
      operationId: reanalyzeAll
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      responses:
        "200":
          description: Re-analysis triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      queued:
                        type: integer
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Queue (org-scoped access) ──────────────────────────────────
  /api/queue/stats:
    get:
      tags: [Queue]
      summary: Get queue statistics
      description: >
        Returns current queue statistics for diff and analyze job types.
        Queue data is global (Redis-backed), but requires org membership for access.
      operationId: getQueueStats
      parameters:
        - $ref: "#/components/parameters/XOrgId"
      responses:
        "200":
          description: Queue statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_QueueStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/queue/dead:
    get:
      tags: [Queue]
      summary: Get dead letter jobs
      description: Returns dead-letter jobs for a given queue type (default analyze).
      operationId: getDeadJobs
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - name: type
          in: query
          schema:
            type: string
            enum: [diff, analyze]
            default: analyze
      responses:
        "200":
          description: List of dead jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/queue/retry-dead:
    post:
      tags: [Queue]
      summary: Retry dead letter jobs
      description: Re-queues all dead-letter jobs for a given type.
      operationId: retryDeadJobs
      parameters:
        - $ref: "#/components/parameters/XOrgId"
        - name: type
          in: query
          schema:
            type: string
            enum: [diff, analyze]
            default: analyze
      responses:
        "200":
          description: Jobs re-queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      count:
                        type: integer
                  error:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Organizations ──────────────────────────────────────────────
  /api/orgs:
    post:
      tags: [Organizations]
      summary: Create organization
      description: Creates a new organization. The authenticated user becomes the owner.
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Organizations]
      summary: List organizations
      description: Lists all organizations the authenticated user belongs to.
      operationId: listOrganizations
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_OrgList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orgs/{orgId}:
    get:
      tags: [Organizations]
      summary: Get organization
      description: Returns organization details. Requires `org:read` permission.
      operationId: getOrganization
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Organization"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Organizations]
      summary: Update organization
      description: Updates organization details. Supports partial updates. Requires `org:write` permission.
      operationId: updateOrganization
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Organizations]
      summary: Delete organization
      description: Soft-deletes an organization. Requires `org:delete` permission.
      operationId: deleteOrganization
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Organization deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orgs/{orgId}/members:
    get:
      tags: [Organizations]
      summary: List members
      description: Lists organization members with roles and user info. Requires `members:read` permission.
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: List of members (flattened with email, firstName, lastName at top level)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orgs/{orgId}/members/{userId}:
    delete:
      tags: [Organizations]
      summary: Remove member
      description: Removes a member from the organization. Requires `members:remove` permission.
      operationId: removeMember
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orgs/{orgId}/members/{userId}/role:
    put:
      tags: [Organizations]
      summary: Update member role
      description: Changes a member's role. Requires `members:remove` permission.
      operationId: updateMemberRole
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_OrgMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/orgs/{orgId}/invitations:
    post:
      tags: [Organizations]
      summary: Invite member
      description: Invites a user by email to the organization. Requires `members:invite` permission.
      operationId: inviteMember
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invitation created (includes token for URL construction)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Organizations]
      summary: List pending invitations
      description: Lists pending invitations for the organization. Requires `members:read` permission.
      operationId: listPendingInvitations
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: List of pending invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orgs/{orgId}/invitations/{id}:
    delete:
      tags: [Organizations]
      summary: Revoke invitation
      description: Revokes a pending invitation. Requires `members:invite` permission.
      operationId: revokeInvitation
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Message"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/orgs/{orgId}/invitations/{token}/accept:
    post:
      tags: [Organizations]
      summary: Accept invitation
      description: >
        Accepts an invitation to join an organization. Requires authentication
        but not org membership. The accepting user's email must match the invitation.
      operationId: acceptInvitation
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted — user is now a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_OrgMember"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: Invitation expired

  /api/orgs/{orgId}/roles:
    get:
      tags: [Organizations]
      summary: List roles
      description: Lists roles in the organization. Requires `roles:read` permission.
      operationId: listRoles
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_RoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/orgs/{orgId}/audit-logs:
    get:
      tags: [Organizations]
      summary: List audit logs
      description: >
        Returns a paginated list of audit logs for the organization.
        Requires `audit:read` permission.
      operationId: listAuditLogs
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: integer
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_AuditLogList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Notification Channels (org-scoped) ─────────────────────────
  /api/orgs/{orgId}/notification-channels:
    get:
      tags: [Notifications]
      summary: List notification channels
      description: Lists notification channels for the organization. Requires `notifications:read`.
      operationId: listNotificationChannels
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_ChannelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Notifications]
      summary: Create notification channel
      description: Creates a notification channel. Requires `notifications:create`.
      operationId: createNotificationChannel
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Channel"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/orgs/{orgId}/notification-channels/{id}:
    put:
      tags: [Notifications]
      summary: Update notification channel
      description: Updates a notification channel. Requires `notifications:update`.
      operationId: updateNotificationChannel
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Notifications]
      summary: Delete notification channel
      description: Deletes a notification channel. Requires `notifications:delete`.
      operationId: deleteNotificationChannel
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Channel deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Notification Rules (org-scoped) ────────────────────────────
  /api/orgs/{orgId}/notification-rules:
    get:
      tags: [Notifications]
      summary: List notification rules
      description: Lists notification rules for the organization. Requires `notifications:read`.
      operationId: listNotificationRules
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_RuleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Notifications]
      summary: Create notification rule
      description: Creates a notification rule. Requires `notifications:create`.
      operationId: createNotificationRule
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse_Rule"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/orgs/{orgId}/notification-rules/{id}:
    delete:
      tags: [Notifications]
      summary: Delete notification rule
      description: Deletes a notification rule. Requires `notifications:delete`.
      operationId: deleteNotificationRule
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Rule deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/auth/login or /api/auth/register
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key created via /api/auth/api-keys

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrgIdPath:
      name: orgId
      in: path
      required: true
      schema:
        type: integer
    XOrgId:
      name: X-Org-ID
      in: header
      required: true
      description: Organization ID (can also be passed as `org_id` query parameter)
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
      description: Column to sort by (varies per endpoint)
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        data:
          nullable: true
        error:
          type: string

    # ── Domain Schemas ──────────────────────────────────────────────

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        emailVerified:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        ownerId:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrgMember:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
        userId:
          type: integer
        roleId:
          type: integer
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    Role:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    Permission:
      type: object
      properties:
        id:
          type: integer
        resource:
          type: string
        action:
          type: string

    Package:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
        name:
          type: string
        registry:
          type: string
          enum: [pypi, npm]
        latestVersion:
          type: string
        description:
          type: string
        isCustom:
          type: boolean
        rank:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Release:
      type: object
      properties:
        id:
          type: integer
        packageId:
          type: integer
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        tarballUrl:
          type: string
        sha256:
          type: string
        status:
          type: string
          enum: [pending, diffing, analyzing, completed, error]
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time

    ReleaseDetail:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          properties:
            diff:
              $ref: "#/components/schemas/Diff"
            analysis:
              $ref: "#/components/schemas/Analysis"
            package:
              $ref: "#/components/schemas/Package"
            isBaseline:
              type: boolean

    RecentRelease:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          properties:
            packageName:
              type: string
            packageRegistry:
              type: string
            classification:
              type: string
              enum: [benign, suspicious, malicious, baseline]

    Diff:
      type: object
      properties:
        id:
          type: integer
        releaseId:
          type: integer
        prevReleaseId:
          type: integer
        diffContent:
          type: string
        fileChangesCount:
          type: integer
        linesAdded:
          type: integer
        linesRemoved:
          type: integer
        createdAt:
          type: string
          format: date-time

    Analysis:
      type: object
      properties:
        id:
          type: integer
        diffId:
          type: integer
        classification:
          type: string
          enum: [benign, suspicious, malicious, baseline]
        confidence:
          type: number
          format: double
        reasoning:
          type: string
        modelUsed:
          type: string
        analyzerType:
          type: string
          enum: [api, cli, copilot]
        createdAt:
          type: string
          format: date-time

    Alert:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
        analysisId:
          type: integer
        packageId:
          type: integer
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [new, acknowledged, resolved]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AlertWithDetails:
      allOf:
        - $ref: "#/components/schemas/Alert"
        - type: object
          properties:
            packageName:
              type: string
            packageRegistry:
              type: string

    DashboardStats:
      type: object
      properties:
        totalPackages:
          type: integer
          format: int64
        totalReleases:
          type: integer
          format: int64
        pendingAnalyses:
          type: integer
          format: int64
        activeAlerts:
          type: integer
          format: int64
        recentMalicious:
          type: integer
          format: int64

    ChartData:
      type: object
      properties:
        releaseActivity:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              releases:
                type: integer
                format: int64
        classifications:
          type: array
          items:
            type: object
            properties:
              classification:
                type: string
              count:
                type: integer
                format: int64
        registries:
          type: array
          items:
            type: object
            properties:
              registry:
                type: string
              count:
                type: integer
                format: int64
        alertsBySeverity:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
              count:
                type: integer
                format: int64
        releaseStatuses:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
                format: int64

    QueueStats:
      type: object
      properties:
        pending:
          type: integer
          format: int64
        processing:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        dead:
