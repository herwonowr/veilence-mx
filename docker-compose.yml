services:
  postgres:
    image: postgres:16-alpine
    container_name: veilence-mx-db
    environment:
      POSTGRES_DB: veilence_mx
      POSTGRES_USER: veilence
      POSTGRES_PASSWORD: veilence_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - veilence-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veilence -d veilence_mx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veilence-mx-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - veilence-net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: veilence-mx-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - veilence-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veilence-mx-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://veilence:veilence_dev@postgres:5432/veilence_mx?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SERVER_PORT: "8080"
      JWT_SECRET: dev-jwt-secret-change-in-production
      APP_ENV: development
      FRONTEND_URL: http://localhost:3000
      LLM_PROVIDER: copilot
      LLM_API_URL: http://host.docker.internal:4141
      LLM_MODEL: claude-sonnet-4.6
      REQUIRE_EMAIL_VERIFICATION: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@veilence-mx.dev
      SMTP_USE_TLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - veilence-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veilence-mx-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veilence-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  veilence-net:
    driver: bridge
