# docker-compose.prod.yml - Production configuration for Veilence-MX
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All secrets are read from .env (not committed to source control).
# See docs/deployment.md for full setup instructions.

services:
  postgres:
    image: postgres:18-alpine
    container_name: veilence-mx-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veilence_mx}
      POSTGRES_USER: ${POSTGRES_USER:-veilence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veilence} -d ${POSTGRES_DB:-veilence_mx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    container_name: veilence-mx-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veilence-mx-backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-veilence}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-veilence_mx}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SERVER_PORT: "8080"
      METRICS_PORT: "9090"
      APP_ENV: production
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      ECOSYSTEMS_ENABLED: ${ECOSYSTEMS_ENABLED:-npm,pypi,go}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      SSO_ENABLED: ${SSO_ENABLED:-false}
      SSO_ENCRYPTION_KEY: ${SSO_ENCRYPTION_KEY:-}
      SSO_SAML_CLOCK_SKEW: ${SSO_SAML_CLOCK_SKEW:-30s}
      SSO_STATE_TTL: ${SSO_STATE_TTL:-5m}
      DIFF_WORKER_CONCURRENCY: ${DIFF_WORKER_CONCURRENCY:-5}
      DIFF_SIZE_LIMIT: ${DIFF_SIZE_LIMIT:-153600}
      LLM_MAX_DIFF_SIZE: ${LLM_MAX_DIFF_SIZE:-153600}
      # For bedrock provider, uncomment these and set LLM_PROVIDER=bedrock:
      # LLM_PROVIDER: bedrock
      # LLM_MODEL: anthropic.claude-sonnet-4-20250514
      # AWS_REGION: ${AWS_REGION:-us-east-1}
      # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      ANALYZE_WORKER_CONCURRENCY: ${ANALYZE_WORKER_CONCURRENCY:-3}
      DIFF_JOB_TIMEOUT_SECONDS: ${DIFF_JOB_TIMEOUT_SECONDS:-600}
      ANALYZE_JOB_TIMEOUT_SECONDS: ${ANALYZE_JOB_TIMEOUT_SECONDS:-300}
      POLLER_WORKSPACE_CONCURRENCY: ${POLLER_WORKSPACE_CONCURRENCY:-5}
      MAX_ARCHIVE_FILE_COUNT: ${MAX_ARCHIVE_FILE_COUNT:-50000}
      MAX_ARCHIVE_SIZE: ${MAX_ARCHIVE_SIZE:-524288000}
      MAX_FILE_EXTRACT_SIZE: ${MAX_FILE_EXTRACT_SIZE:-52428800}
      MAX_FILE_READ_SIZE: ${MAX_FILE_READ_SIZE:-1048576}
      MAX_REGISTRY_DOWNLOAD_SIZE: ${MAX_REGISTRY_DOWNLOAD_SIZE:-209715200}
      MAX_BULK_IMPORT: ${MAX_BULK_IMPORT:-500}
      MAX_BULK_APPROVE: ${MAX_BULK_APPROVE:-1000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veilence-mx-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  # Internal network - database and Redis are NOT exposed to the host
  internal:
    driver: bridge
    internal: true
  # External network - API and frontend are accessible from the host
  external:
    driver: bridge
